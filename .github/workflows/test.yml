name: Test Build and Compress Tools (Ubuntu 22.04)

on:
  schedule:
    # 每周日 UTC 时间 0:00 运行一次 (即北京时间周一早上 8:00)
    - cron: '0 0 * * 0'
  workflow_dispatch: # 允许在 GitHub 页面手动点击触发

jobs:
  test-build-and-compress:
    runs-on: ubuntu-22.04 # 直接使用 GitHub 提供的 Ubuntu 22.04 运行器
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Install Base Environment and Compress Tools
        run: |
          set -e
          sudo apt-get update
          # 安装 p7zip-full (提供 7z), rar, unrar 及编译依赖
          sudo apt-get install -y zip tar p7zip-full rar unrar curl build-essential libffi-dev libssl-dev

      - name: 2. Verify 7z Command
        run: |
          7z | head -n 2 || true
          if ! command -v 7z &> /dev/null; then echo '❌ 7z 安装失败'; exit 1; fi
          echo '✅ 7z 命令正常'

      - name: 3. Verify rar Command
        run: |
          rar | head -n 2 || true
          if ! command -v rar &> /dev/null; then echo '❌ rar 安装失败'; exit 1; fi
          echo '✅ rar 命令正常'

      - name: 4. Test 7z Compress and Extract
        run: |
          echo 'hello 7z' > test7z.txt
          7z a test.7z test7z.txt
          mkdir -p extracted_7z
          7z x test.7z -oextracted_7z
          if [ -f extracted_7z/test7z.txt ]; then echo '✅ 7z 压缩解压测试成功'; else echo '❌ 7z 测试失败'; exit 1; fi

      - name: 5. Test rar Compress and Extract
        run: |
          echo 'hello rar' > testrar.txt
          rar a test.rar testrar.txt
          mkdir -p extracted_rar
          unrar x test.rar extracted_rar/
          if [ -f extracted_rar/testrar.txt ]; then echo '✅ rar 压缩解压测试成功'; else echo '❌ rar 测试失败'; exit 1; fi

      - name: 6. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 7. Test PyInstaller Build
        run: |
          set -e
          # 检查项目必要文件是否存在
          if [ ! -f requirements.txt ]; then echo "❌ 找不到 requirements.txt，请确保工作流在项目根目录运行"; exit 1; fi
          if [ ! -f main.py ]; then echo "❌ 找不到 main.py"; exit 1; fi

          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary paramiko pyinstaller
          
          # 使用与正式打包完全一致的命令
          pyinstaller --onefile --add-data 'web:web' --add-data 'core:core' --add-data 'config.json:.' main.py
          
          if [ -f dist/main ]; then
              echo '✅ PyInstaller 二进制打包成功'
              ls -lh dist/main
          else
              echo '❌ PyInstaller 打包失败'
              exit 1
          fi
          
          echo '================================'
          echo '  ✅ 所有测试通过！'
          echo '  Ubuntu 22.04 环境及压缩工具正常。'
          echo '================================'
