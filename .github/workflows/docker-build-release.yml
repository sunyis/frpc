name: "Docker Build and Push"

on:
  push:
  workflow_dispatch:

env:
  PROJECT: frpc
  CUSTOM_VERSION: "0.28.2"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub Username
        id: validate
        run: |
          # 验证用户名是否有效
          USERNAME="${{ secrets.DOCKER_USERNAME }}"
          if [[ -z "$USERNAME" ]]; then
            echo "❌ DOCKER_USERNAME secret is empty"
            exit 1
          fi
          
          # Docker Hub 用户名验证（小写字母、数字、连字符）
          if [[ ! "$USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "❌ Invalid Docker Hub username format: $USERNAME"
            echo "   Username must contain only lowercase letters, numbers, hyphens and underscores"
            exit 1
          fi
          
          echo "✅ Valid Docker Hub username: $USERNAME"
          echo "PROJECT_NAME=${{ env.PROJECT }}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${{ env.CUSTOM_VERSION }}" >> $GITHUB_ENV

      - name: Validate Dockerfile
        run: |
          echo "🔍 验证 Dockerfile 语法..."
          if [ ! -f "Dockerfile" ]; then
            echo "❌ Dockerfile 不存在"
            exit 1
          fi
          
          # 检查基础镜像是否存在
          BASE_IMAGE=$(grep '^FROM' Dockerfile | head -1 | awk '{print $2}')
          echo "📦 基础镜像: $BASE_IMAGE"
          
          # 检查必要的指令
          if ! grep -q "CMD" Dockerfile && ! grep -q "ENTRYPOINT" Dockerfile; then
            echo "⚠️ 警告: Dockerfile 中没有 CMD 或 ENTRYPOINT 指令"
          fi
          
          # 检查工作目录
          if grep -q "WORKDIR" Dockerfile; then
            WORKDIR=$(grep '^WORKDIR' Dockerfile | head -1 | awk '{print $2}')
            echo "📁 工作目录: $WORKDIR"
          fi
          
          echo "✅ Dockerfile 语法检查通过"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Multi-Arch Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false  # 先不推送，先构建
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          outputs: type=docker,dest=/tmp/image.tar

      - name: Verify Built Image
        run: |
          echo "🔍 验证构建的 Docker 镜像..."
          
          # 加载镜像并检查
          docker load -i /tmp/image.tar
          
          # 获取镜像ID
          IMAGE_ID=$(docker images --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}" | grep "${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}" | awk '{print $2}' | head -1)
          
          if [ -z "$IMAGE_ID" ]; then
            echo "❌ 无法找到构建的镜像"
            exit 1
          fi
          
          echo "✅ 镜像构建成功: $IMAGE_ID"
          
          # 检查镜像信息
          echo "📊 镜像详细信息:"
          docker inspect "$IMAGE_ID" | jq -r '.[0] | {Architecture: .Architecture, Os: .Os, Size: .Size, Cmd: .Config.Cmd, Entrypoint: .Config.Entrypoint}'
          
          # 检查镜像层
          echo "📁 镜像层信息:"
          docker history "$IMAGE_ID" --format "table {{.CreatedBy}}\t{{.Size}}"
          
          echo "✅ 镜像验证完成"

      - name: Test Container Functionality
        run: |
          echo "🧪 测试容器功能..."
          
          # 创建测试目录和配置文件
          TEST_DIR=$(mktemp -d)
          echo "📁 创建测试目录: $TEST_DIR"
          
          # 创建测试配置文件
          cat > "$TEST_DIR/frpc.ini" << 'EOF'
[common]
server_addr = 127.0.0.1
server_port = 7000

[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000
EOF
          
          # 测试容器启动
          echo "🚀 启动测试容器..."
          docker run -d \
            --name test-frpc \
            -v "$TEST_DIR:/frp/config" \
            "${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}"
          
          # 等待容器启动
          sleep 5
          
          # 检查容器状态
          CONTAINER_STATUS=$(docker inspect test-frpc --format='{{.State.Status}}')
          echo "📊 容器状态: $CONTAINER_STATUS"
          
          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "❌ 容器启动失败"
            docker logs test-frpc
            docker rm -f test-frpc
            rm -rf "$TEST_DIR"
            exit 1
          fi
          
          # 检查容器日志
          echo "📋 容器日志:"
          docker logs test-frpc --tail 10
          
          # 检查配置文件是否正确复制
          echo "🔍 检查配置文件..."
          docker exec test-frpc ls -la /frp/config/
          docker exec test-frpc test -f /frp/config/frpc.ini && echo "✅ 配置文件存在" || echo "❌ 配置文件缺失"
          
          # 清理测试容器
          echo "🧹 清理测试容器..."
          docker rm -f test-frpc
          rm -rf "$TEST_DIR"
          
          echo "✅ 容器功能测试通过"

      - name: Push Docker Image
        if: success()
        run: |
          echo "🚀 推送 Docker 镜像到 Docker Hub..."
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}"
          echo "✅ 镜像推送成功: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}"

      - name: Sync README.md to Docker Hub
        if: success()
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}
          readme: "./README.md"

      - name: Success Notification
        if: success()
        run: |
          echo "🎉 Docker 镜像构建和推送完成!"
          echo "📦 镜像名称: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}"
          echo "🏷️ 版本: ${{ env.CUSTOM_VERSION }}"
          echo "📅 构建时间: $(date)"
          echo "✅ 所有校验和测试通过"

      - name: Failure Notification
        if: failure()
        run: |
          echo "❌ Docker 镜像构建失败!"
          echo "🔍 请检查以下可能的问题:"
          echo "   - Dockerfile 语法错误"
          echo "   - 基础镜像不可用"
          echo "   - 构建依赖问题"
          echo "   - 网络连接问题"
          echo "   - 容器启动失败"
          echo "📅 失败时间: $(date)"
          exit 1
