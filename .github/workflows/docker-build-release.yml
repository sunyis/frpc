name: "Docker Build and Push"

on:
  push:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Custom version tag'
        required: false
        default: '28.2'

env:
  PROJECT: frpc

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Custom Version
        id: version
        run: |
          # 使用手动输入的版本或默认值
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
          else
            CUSTOM_VERSION="28.2"
          fi
          echo "CUSTOM_VERSION=$CUSTOM_VERSION" >> $GITHUB_ENV
          echo "Using version: $CUSTOM_VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify Pushed Images
        run: |
          echo "✅ Successfully pushed Docker images:"
          echo "   - ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:latest"
          echo "   - ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.CUSTOM_VERSION }}"

      - name: Sync README.md to Docker Hub
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}
          readme: "./README.md"
